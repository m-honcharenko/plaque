<svg xmlns="http://www.w3.org/2000/svg" width="149" height="28" viewBox="0 0 149 28" role="img" aria-label="build: passing">
  <title>build: passing</title>
  <style>
    :root { --fg: #1f2328; --chip: #f6f8fa; --ok: #1a7f37; --info: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --chip: #161b22; --ok: #2ea043; --info: #388bfd; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l-bg { fill: var(--chip); }
    .ok-bg { fill: var(--ok); }
    .info-bg { fill: var(--info); }
    .l-t { fill: var(--fg); }
    .v-t { fill: #ffffff; font-weight: 600; }
    .ic-l { fill: none; stroke: var(--fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ic-v { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="r"><rect width="149" height="28" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect class="l-bg" x="0" y="0" width="75" height="28"/>
    <rect class="ok-bg" x="75" y="0" width="74" height="28"/>
    <g transform="translate(10 6) scale(0.6667)">
      <rect class="ic-l" x="3" y="3" width="7" height="7" rx="2"/>
      <rect class="ic-l" x="14" y="14" width="7" height="7" rx="2"/>
      <path class="ic-l" d="M6.5 10v4.5a3 3 0 0 0 3 3H14"/>
    </g>
    <text class="l-t" x="33" y="18.5" font-size="13" textLength="30" lengthAdjust="spacingAndGlyphs">build</text>
    <text class="v-t" x="112.0" y="18.5" text-anchor="middle" font-size="13" textLength="50" lengthAdjust="spacingAndGlyphs">passing</text>
  </g>
</svg>
