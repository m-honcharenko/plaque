<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>Plaque</title>
		<script>
			// Sets the page theme before the first paint, so there is no flash.
			try {
				var stored = localStorage.getItem("plaque-theme")
				var dark =
					stored === "dark" ||
					(stored !== "light" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches)
				document.documentElement.classList.toggle("dark", dark)
			} catch (error) {}
		</script>
		<link
			rel="icon"
			href="data:,"
		/>
		<link
			rel="stylesheet"
			href="./src/styles.css"
		/>
	</head>
	<body>
		<div id="app"></div>
		<script
			type="module"
			src="./src/main.tsx"
		></script>
	</body>
</html>
