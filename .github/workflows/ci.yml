name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:e2e
      - run: bun run build
      - run: bun run render:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-screenshots
          path: .render/*.png
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t plaque:ci .
      - name: Smoke test image
        run: |
          docker run -d --name plaque -p 3000:3000 plaque:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && break
            sleep 1
          done
          curl -fsS "http://localhost:3000/badge?label=ci&value=ok" | grep -q "<svg"
          curl -fsS http://localhost:3000/ | grep -q 'id="app"'
          docker rm -f plaque
